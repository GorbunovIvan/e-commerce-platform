apiVersion : apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  labels:
    app: e-commerce-platform-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      project: e-commerce-platform-notification-service
  template:
    metadata:
      labels:
        project: e-commerce-platform-notification-service
    spec:
      containers:
        - name: notification-service
          image: ivangorbunovv/e-commerce-platform:notification-service
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_APPLICATION_JSON
              value: >
                {
                 "spring.config.import" : "configserver:http://config-server:8888",
                 "mail.username" : "amosovivan91@gmail.com",
                 "mail.password" : "mcyx kbwf pvpo mmwj",
                 "mail.receiver" : "gorbunovvivan@gmail.com"
                }

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
     env  : dev
     owner: IvanGorbunov
spec:
  selector:
    project: e-commerce-platform-notification-service
  ports:
    - name      : notification-service-listener
      protocol  : TCP
      port      : 8085
      targetPort: 8085
  #type: CLusterIP