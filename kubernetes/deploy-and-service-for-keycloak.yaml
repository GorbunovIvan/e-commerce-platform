apiVersion : apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  labels:
    app: e-commerce-platform-keycloak
spec:
  replicas: 1 #2
  selector:
    matchLabels:
      project: e-commerce-platform-keycloak
  template:
    metadata:
      labels:
        project: e-commerce-platform-keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          command: ["sh", "-c", "/opt/keycloak/bin/kc.sh start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    env  : dev
    owner: IvanGorbunov
spec:
  selector:
    project: e-commerce-platform-keycloak
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  #type: CLusterIP
