apiVersion : apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  labels:
    app: e-commerce-platform-mongo
spec:
  replicas: 1 #2
  selector:
    matchLabels:
      project: e-commerce-platform-mongo
  template:
    metadata:
      labels:
        project: e-commerce-platform-mongo
    spec:
      containers:
        - name : mongo
          image: mongo:latest
          ports:
          - containerPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db
  labels:
    env  : dev
    owner: IvanGorbunov
spec:
  selector:
    project: e-commerce-platform-mongo
  ports:
    - name      : mongo-listener
      protocol  : TCP
      port      : 27018
      targetPort: 27017
  #type: CLusterIP
