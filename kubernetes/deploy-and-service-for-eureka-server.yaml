apiVersion : apps/v1
kind: Deployment
metadata:
  name: eureka-server-deployment
  labels:
    app: e-commerce-platform-eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      project: e-commerce-platform-eureka-server
  template:
    metadata:
      labels:
        project: e-commerce-platform-eureka-server
    spec:
      containers:
        - name: eureka-server
          image: ivangorbunovv/e-commerce-platform:eureka-server
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_APPLICATION_JSON
              value: >
                {
                 "spring.config.import" : "configserver:http://config-server:8888"
                }

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  labels:
     env  : dev
     owner: IvanGorbunov
spec:
  selector:
    project: e-commerce-platform-eureka-server
  ports:
    - name      : eureka-server-listener
      protocol  : TCP
      port      : 8761
      targetPort: 8761
  #type: CLusterIP