apiVersion : apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: e-commerce-platform-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      project: e-commerce-platform-api-gateway
  template:
    metadata:
      labels:
        project: e-commerce-platform-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ivangorbunovv/e-commerce-platform:api-gateway
          ports:
            - containerPort: 8765
          env:
            - name: SPRING_APPLICATION_JSON
              value: >
                {
                 "spring.config.import" : "configserver:http://config-server:8888"
                }

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
     env  : dev
     owner: IvanGorbunov
spec:
  selector:
    project: e-commerce-platform-api-gateway
  ports:
    - name      : api-gateway-listener
      protocol  : TCP
      port      : 8765
      targetPort: 8765
  #type: CLusterIP